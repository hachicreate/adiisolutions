<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリ紹介 | hachicreate</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; background-color: #fffcf5; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        
        h1 { font-size: 2.5rem; margin-bottom: 50px; color: #ff914d; }
        
        .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        @media (max-width: 768px) { .app-grid { grid-template-columns: 1fr; } }
        
        .app-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            border: 2px solid #ffde59;
            box-shadow: 0 10px 20px rgba(255, 222, 89, 0.15); 
            transition: transform 0.3s; 
        }
        .app-card:hover { transform: translateY(-10px); }
        
        .app-card h2 { margin-bottom: 20px; color: #ff914d; }
        .app-card p { color: #666; margin-bottom: 30px; }
        
        .btn { 
            display: inline-block; 
            padding: 12px 30px; 
            background-color: #ffde59; 
            color: #333; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        .btn:hover { background-color: #ff914d; color: white; }
        
        .back-link { margin-top: 80px; display: block; text-decoration: none; color: #ff914d; font-weight: bold; }
        
        footer { margin-top: 30px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>アプリ紹介</h1>
        <p>日々の暮らしを少しだけ便利に、豊かにするアプリをご紹介します。</p>

        <div class="app-grid">
            <div class="app-card">
                <h2>ToDoメモ</h2>
                <p>思いついたら、サッと書く。<br>まるで「紙の付箋」のような新感覚ToDoアプリ。</p>
                <a href="product_todomemo.html" class="btn">詳細を見る</a>
            </div>

            <div class="app-card">
                <h2>MonoCheck</h2>
                <p>「あ、買い忘れた！」をもう終わりに。<br>日用品のストックを賢く管理するパートナー。</p>
                <a href="product_monocheck.html" class="btn">詳細を見る</a>
            </div>
        </div>

        <a href="index.html" class="back-link">トップへ戻る</a>

        <footer>
            &copy; 2026 hachicreate
        </footer>
    </div>
</body>
</html>
